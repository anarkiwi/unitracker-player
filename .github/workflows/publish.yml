name: publish

# Publishes to PyPI via trusted publishing (OIDC). Register the trusted publisher on PyPI:
# project unitracker-player, owner anarkiwi, repository unitracker-player, workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/unitracker-player/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
