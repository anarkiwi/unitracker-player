name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev]"
      - uses: anarkiwi/pysidtracker/.github/actions/cache@v0.30.0
        with:
          key: ${{ hashFiles('tests/*.py') }}
          sidtrace: "true"
          tunes: tests
      - run: docker pull ghcr.io/anarkiwi/docker-mos-llvm-sdk:23.3.0
      - run: black --check src tests
      - run: pylint src
      - run: pylint --disable=missing-function-docstring tests
      - run: pytest -n auto --cov=unitracker_player --cov-fail-under=85
