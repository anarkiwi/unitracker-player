name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev]"
      - run: black --check src tests
      - run: pylint src
      - run: pylint --disable=missing-function-docstring tests
      - run: pytest -n auto --cov=unitracker_player --cov-fail-under=85
