name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev]"
      - uses: anarkiwi/pysidtracker/.github/actions/cache@v0.38.0
        with:
          key: ${{ hashFiles('tests/*.py') }}
          sidtrace: "true"
          tunes: tests
      - run: docker pull ghcr.io/anarkiwi/docker-mos-llvm-sdk:23.3.0
      - run: black --check src tests tools
      - run: pylint src tools
      - run: pylint --disable=missing-function-docstring tests
      - run: pytest -n auto --cov=unitracker_player --cov-fail-under=85

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/native.Dockerfile
          build-args: PYTHON_VERSION=${{ matrix.python-version }}
          tags: utp-native:${{ matrix.python-version }}
          load: true
          cache-from: type=gha,scope=native-${{ matrix.python-version }}
          cache-to: type=gha,scope=native-${{ matrix.python-version }},mode=max
      - name: Test
        run: docker run --rm utp-native:${{ matrix.python-version }}
