    tay
    sec
    lda v
    sbc F.lo,y
    tax
    lda v+1
    sbc F.hi,y
    bcc up
    bne dn
    txa
    beq done
    dn:
    lda v
    sbc #<s
    sta v
    lda v+1
    sbc #>s
