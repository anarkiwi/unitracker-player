[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitracker-player"
version = "0.1.4"
description = "Plays canonical unitracker documents to SID register state per tick"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
  "unitracker-grammar @ git+https://github.com/anarkiwi/unitracker-grammar",
  "lark>=1.2",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["black>=24", "pylint>=3", "pytest>=7", "pytest-cov>=4", "pytest-xdist>=3"]

[project.scripts]
unitracker-play = "unitracker_player.cli:main"

[project.urls]
Homepage = "https://github.com/anarkiwi/unitracker-player"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100

[tool.pylint.design]
max-attributes = 16
min-public-methods = 1
max-returns = 10
