[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitracker-player"
version = "0.24.0"
description = "Plays canonical unitracker documents to SID register state per tick, and builds them into standalone .sid files"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
  "unitracker-grammar>=0.17.1",
  "jennings>=0.2",
  "lark>=1.2",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "black>=24",
  "pylint>=3",
  "pytest>=7",
  "pytest-cov>=4",
  "pytest-xdist>=3",
  "pysidtracker>=0.30.0",
  "zstandard>=0.21",
]

[project.scripts]
unitracker-play = "unitracker_player.cli:main"
unitracker-sid = "unitracker_player.cli:sid_main"

[project.urls]
Homepage = "https://github.com/anarkiwi/unitracker-player"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitracker_player = ["asm/*.s", "asm/*.ld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["noncanonical: reads texts other than the canonical one"]

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100

[tool.pylint.design]
max-attributes = 16
min-public-methods = 1
max-returns = 10
